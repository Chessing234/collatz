name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
      - name: Check integrity
        run: ./scripts/check_integrity.sh
