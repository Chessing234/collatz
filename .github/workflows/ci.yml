name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test proof-escape scanner
        run: python3 scripts/test_check_proof_escapes.py

      - name: Check generated first-crossing certificates
        run: python3 scripts/generate_first_light_1024.py --check

      - name: Build and setup Lean
        id: lean-action
        uses: leanprover/lean-action@v1
        with:
          # The project has no Lake test target, so keep testing disabled.
          auto-config: false
          build: true
          test: false
          # lean-action caches the .lake directory by default; make it explicit.
          use-github-cache: true

      - name: Check integrity
        run: ./scripts/check_integrity.sh

      - name: Check exact first-descent intervals
        run: |
          python3 scripts/descent_intervals.py --check
          python3 scripts/test_descent_intervals.py
          python3 scripts/audit_descent_intervals.py

      - name: Check coefficient crossing and interval transfer
        run: python3 scripts/audit_coefficient_descent.py
