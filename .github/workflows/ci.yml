name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and setup Lean
        id: lean-action
        uses: leanprover/lean-action@v1
        with:
          # The project has no Lake test target, so keep testing disabled.
          auto-config: false
          build: true
          test: false
          # lean-action caches the .lake directory by default; make it explicit.
          use-github-cache: true

      - name: Check integrity
        run: ./scripts/check_integrity.sh
